name: noteflow_ai
description: "AI-powered voice and meeting notes with real-time sync, transcription, action items, and sharing."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  http: ^1.3.0
  uuid: ^4.5.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  record: ^7.1.1
  audioplayers: ^6.8.1
  file_picker: ^13.1.0
  supabase_flutter: ^2.17.2
  sign_in_with_apple: ^8.2.0
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
